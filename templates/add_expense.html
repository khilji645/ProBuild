{% extends "base.html" %}
{% block title %}Add Expense{% endblock %}
{% block content %}
<div class="page-header"><h2>Add Expense</h2></div>
<div class="card"><div class="card-body">
<form method="POST">
<div class="row">
<div class="col-md-6 mb-3"><label>Category *</label><input type="text" class="form-control" name="category" required placeholder="e.g., Materials, Labor"></div>
<div class="col-md-6 mb-3"><label>Project</label><select class="form-select" name="project_id">
<option value="">General Expense</option>
{% for proj in projects %}
<option value="{{ proj['id'] }}">{{ proj['name'] }}</option>
{% endfor %}
</select></div>
</div>
<div class="mb-3"><label>Description *</label><input type="text" class="form-control" name="description" required></div>
<div class="row">
<div class="col-md-4 mb-3"><label>Amount *</label><input type="number" class="form-control" name="amount" step="0.01" required></div>
<div class="col-md-4 mb-3"><label>Date *</label><input type="date" class="form-control" name="date" required></div>
<div class="col-md-4 mb-3"><label>Status</label><select class="form-select" name="status">
<option value="Pending">Pending</option><option value="Paid">Paid</option>
</select></div>
</div>
<div class="row">
<div class="col-md-4 mb-3"><label>Vendor</label><input type="text" class="form-control" name="vendor"></div>
<div class="col-md-4 mb-3"><label>Payment Method</label><input type="text" class="form-control" name="payment_method"></div>
<div class="col-md-4 mb-3"><label>Receipt Number</label><input type="text" class="form-control" name="receipt_number"></div>
</div>
<div class="mb-3"><label>Notes</label><textarea class="form-control" name="notes" rows="2"></textarea></div>
<button type="submit" class="btn btn-primary">Save Expense</button>
<a href="{{ url_for('expenses') }}" class="btn btn-secondary">Cancel</a>
</form>
</div></div>
{% endblock %}
