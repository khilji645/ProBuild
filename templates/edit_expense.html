{% extends "base.html" %}
{% block title %}Edit Expense{% endblock %}
{% block content %}
<div class="page-header"><h2>Edit Expense</h2></div>
<div class="card"><div class="card-body">
<form method="POST">
<div class="row">
<div class="col-md-6 mb-3"><label>Category *</label><input type="text" class="form-control" name="category" value="{{ expense['category'] }}" required></div>
<div class="col-md-6 mb-3"><label>Project</label><select class="form-select" name="project_id">
<option value="">General Expense</option>
{% for proj in projects %}
<option value="{{ proj['id'] }}" {% if proj['id']==expense['project_id'] %}selected{% endif %}>{{ proj['name'] }}</option>
{% endfor %}
</select></div>
</div>
<div class="mb-3"><label>Description *</label><input type="text" class="form-control" name="description" value="{{ expense['description'] }}" required></div>
<div class="row">
<div class="col-md-4 mb-3"><label>Amount *</label><input type="number" class="form-control" name="amount" step="0.01" value="{{ expense['amount'] }}" required></div>
<div class="col-md-4 mb-3"><label>Date *</label><input type="date" class="form-control" name="date" value="{{ expense['date'] }}" required></div>
<div class="col-md-4 mb-3"><label>Status</label><select class="form-select" name="status">
<option value="Pending" {% if expense['status']=='Pending' %}selected{% endif %}>Pending</option>
<option value="Paid" {% if expense['status']=='Paid' %}selected{% endif %}>Paid</option>
</select></div>
</div>
<div class="row">
<div class="col-md-4 mb-3"><label>Vendor</label><input type="text" class="form-control" name="vendor" value="{{ expense['vendor'] or '' }}"></div>
<div class="col-md-4 mb-3"><label>Payment Method</label><input type="text" class="form-control" name="payment_method" value="{{ expense['payment_method'] or '' }}"></div>
<div class="col-md-4 mb-3"><label>Receipt Number</label><input type="text" class="form-control" name="receipt_number" value="{{ expense['receipt_number'] or '' }}"></div>
</div>
<div class="mb-3"><label>Notes</label><textarea class="form-control" name="notes" rows="2">{{ expense['notes'] or '' }}</textarea></div>
<button type="submit" class="btn btn-primary">Update Expense</button>
<a href="{{ url_for('expenses') }}" class="btn btn-secondary">Cancel</a>
</form>
</div></div>
{% endblock %}
