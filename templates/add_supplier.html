{% extends "base.html" %}
{% block title %}Add Supplier{% endblock %}
{% block content %}
<div class="page-header"><h2>Add Supplier</h2></div>
<div class="card"><div class="card-body">
<form method="POST">
<div class="row">
<div class="col-md-6 mb-3"><label>Name *</label><input type="text" class="form-control" name="name" required></div>
<div class="col-md-6 mb-3"><label>Company</label><input type="text" class="form-control" name="company"></div>
</div>
<div class="row">
<div class="col-md-6 mb-3"><label>Email</label><input type="email" class="form-control" name="email"></div>
<div class="col-md-6 mb-3"><label>Phone</label><input type="text" class="form-control" name="phone"></div>
</div>
<div class="row">
<div class="col-md-8 mb-3"><label>Address</label><input type="text" class="form-control" name="address"></div>
<div class="col-md-4 mb-3"><label>Category</label><input type="text" class="form-control" name="category" placeholder="e.g., Materials, Equipment"></div>
</div>
<div class="row">
<div class="col-md-6 mb-3"><label>Rating</label><select class="form-select" name="rating">
<option value="">No Rating</option>
<option value="1">1 Star</option><option value="2">2 Stars</option><option value="3">3 Stars</option><option value="4">4 Stars</option><option value="5">5 Stars</option>
</select></div>
</div>
<div class="mb-3"><label>Notes</label><textarea class="form-control" name="notes" rows="3"></textarea></div>
<button type="submit" class="btn btn-primary">Save Supplier</button>
<a href="{{ url_for('suppliers') }}" class="btn btn-secondary">Cancel</a>
</form>
</div></div>
{% endblock %}
