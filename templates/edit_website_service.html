{% extends "base.html" %}
{% block title %}Edit Service{% endblock %}
{% block content %}
<div class="page-header"><h2><i class="fas fa-edit"></i> Edit Service</h2></div>
<div class="card"><div class="card-body">
<form method="POST">
<div class="row">
<div class="col-md-3 mb-3"><label>Icon (Font Awesome class)</label>
<input type="text" class="form-control" name="icon" value="{{ service.icon }}">
<small class="text-muted">Browse icons at <a href="https://fontawesome.com/search?o=r&m=free" target="_blank">fontawesome.com</a></small>
</div>
<div class="col-md-9 mb-3"><label>Title *</label>
<input type="text" class="form-control" name="title" value="{{ service.title }}" required>
</div>
</div>
<div class="mb-3"><label>Description</label>
<textarea class="form-control" name="description" rows="3">{{ service.description or '' }}</textarea>
</div>
<div class="row">
<div class="col-md-6 mb-3"><label>Sort Order</label>
<input type="number" class="form-control" name="sort_order" value="{{ service.sort_order }}">
<small class="text-muted">Lower numbers appear first.</small>
</div>
<div class="col-md-6 mb-3 d-flex align-items-end">
<div class="form-check">
<input class="form-check-input" type="checkbox" name="show_on_home" id="show_on_home" {% if service.show_on_home %}checked{% endif %}>
<label class="form-check-label" for="show_on_home">Feature on Home page (max 3 shown)</label>
</div>
</div>
</div>
<button type="submit" class="btn btn-primary">Update Service</button>
<a href="{{ url_for('website_services') }}" class="btn btn-secondary">Cancel</a>
</form>
</div></div>
{% endblock %}
