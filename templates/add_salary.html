{% extends "base.html" %}
{% block title %}Add Salary{% endblock %}
{% block content %}
<div class="page-header"><h2>Add Salary Payment</h2></div>
<div class="card"><div class="card-body">
<form method="POST">
<div class="row">
<div class="col-md-6 mb-3"><label>Employee *</label><select class="form-select" name="employee_id" required>
<option value="">Select Employee</option>
{% for emp in employees %}
<option value="{{ emp['id'] }}">{{ emp['name'] }} ({{ emp['position'] or 'N/A' }})</option>
{% endfor %}
</select></div>
<div class="col-md-6 mb-3"><label>Payment Date *</label><input type="date" class="form-control" name="payment_date" required></div>
</div>
<div class="row">
<div class="col-md-3 mb-3"><label>Month</label><input type="number" class="form-control" name="month" min="1" max="12" value="{{ current_month }}"></div>
<div class="col-md-3 mb-3"><label>Year</label><input type="number" class="form-control" name="year" value="{{ current_year }}"></div>
<div class="col-md-6 mb-3"><label>Payment Method</label><input type="text" class="form-control" name="payment_method" placeholder="e.g., Bank Transfer"></div>
</div>
<div class="row">
<div class="col-md-3 mb-3"><label>Amount *</label><input type="number" class="form-control" name="amount" step="0.01" required></div>
<div class="col-md-3 mb-3"><label>Bonus</label><input type="number" class="form-control" name="bonus" step="0.01" value="0"></div>
<div class="col-md-3 mb-3"><label>Deductions</label><input type="number" class="form-control" name="deductions" step="0.01" value="0"></div>
<div class="col-md-3 mb-3"><label>Net Amount</label><input type="number" class="form-control" name="net_amount" step="0.01" id="netAmount" readonly></div>
</div>
<div class="mb-3"><label>Notes</label><textarea class="form-control" name="notes" rows="2"></textarea></div>
<button type="submit" class="btn btn-primary">Save Salary Payment</button>
<a href="{{ url_for('salaries') }}" class="btn btn-secondary">Cancel</a>
</form>
</div></div>
<script>
$('input[name="amount"], input[name="bonus"], input[name="deductions"]').on('input', function(){
var amount = parseFloat($('input[name="amount"]').val()) || 0;
var bonus = parseFloat($('input[name="bonus"]').val()) || 0;
var deductions = parseFloat($('input[name="deductions"]').val()) || 0;
$('#netAmount').val((amount + bonus - deductions).toFixed(2));
});
</script>
{% endblock %}
