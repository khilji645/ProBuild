{% extends "base.html" %}
{% block title %}Edit Project{% endblock %}
{% block content %}
<div class="page-header"><h2><i class="fas fa-edit"></i> Edit Project</h2></div>
<div class="card"><div class="card-body">
<form method="POST">
<div class="row">
<div class="col-md-6 mb-3"><label>Project Name *</label><input type="text" class="form-control" name="name" value="{{ project['name'] }}" required></div>
<div class="col-md-6 mb-3"><label>Client *</label><select class="form-select" name="client_id" required>
{% for client in clients %}<option value="{{ client['id'] }}" {% if client['id'] == project['client_id'] %}selected{% endif %}>{{ client['name'] }}</option>{% endfor %}
</select></div>
</div>
<div class="mb-3"><label>Description</label><textarea class="form-control" name="description" rows="3">{{ project['description'] or '' }}</textarea></div>
<div class="row">
<div class="col-md-3 mb-3"><label>Status</label><select class="form-select" name="status">
<option value="Planning" {% if project['status']=='Planning' %}selected{% endif %}>Planning</option>
<option value="In Progress" {% if project['status']=='In Progress' %}selected{% endif %}>In Progress</option>
<option value="On Hold" {% if project['status']=='On Hold' %}selected{% endif %}>On Hold</option>
<option value="Completed" {% if project['status']=='Completed' %}selected{% endif %}>Completed</option>
</select></div>
<div class="col-md-3 mb-3"><label>Priority</label><select class="form-select" name="priority">
<option value="Low" {% if project['priority']=='Low' %}selected{% endif %}>Low</option>
<option value="Medium" {% if project['priority']=='Medium' %}selected{% endif %}>Medium</option>
<option value="High" {% if project['priority']=='High' %}selected{% endif %}>High</option>
<option value="Critical" {% if project['priority']=='Critical' %}selected{% endif %}>Critical</option>
</select></div>
<div class="col-md-3 mb-3"><label>Budget</label><input type="number" class="form-control" name="budget" step="0.01" value="{{ project['budget'] }}"></div>
<div class="col-md-3 mb-3"><label>Completion %</label><input type="number" class="form-control" name="completion_percentage" min="0" max="100" value="{{ project['completion_percentage'] }}"></div>
</div>
<div class="row">
<div class="col-md-6 mb-3"><label>Start Date</label><input type="date" class="form-control" name="start_date" value="{{ project['start_date'] or '' }}"></div>
<div class="col-md-6 mb-3"><label>End Date</label><input type="date" class="form-control" name="end_date" value="{{ project['end_date'] or '' }}"></div>
</div>
<div class="row">
<div class="col-md-6 mb-3"><label>Location</label><input type="text" class="form-control" name="location" value="{{ project['location'] or '' }}"></div>
<div class="col-md-6 mb-3"><label>Project Manager</label><input type="text" class="form-control" name="project_manager" value="{{ project['project_manager'] or '' }}"></div>
</div>
<div class="mb-3"><label>Notes</label><textarea class="form-control" name="notes" rows="3">{{ project['notes'] or '' }}</textarea></div>
<button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Update Project</button>
<a href="{{ url_for('projects') }}" class="btn btn-secondary">Cancel</a>
</form>
</div></div>
{% endblock %}
