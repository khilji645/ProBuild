{% extends "base.html" %}
{% block title %}Add Employee{% endblock %}
{% block content %}
<div class="page-header"><h2>Add Employee</h2></div>
<div class="card"><div class="card-body">
<form method="POST">
<div class="row">
<div class="col-md-6 mb-3"><label>Name *</label><input type="text" class="form-control" name="name" required></div>
<div class="col-md-6 mb-3"><label>Employee ID</label><input type="text" class="form-control" name="employee_id"></div>
</div>
<div class="row">
<div class="col-md-6 mb-3"><label>Position</label><input type="text" class="form-control" name="position"></div>
<div class="col-md-6 mb-3"><label>Department</label><input type="text" class="form-control" name="department"></div>
</div>
<div class="row">
<div class="col-md-6 mb-3"><label>Email</label><input type="email" class="form-control" name="email"></div>
<div class="col-md-6 mb-3"><label>Phone</label><input type="text" class="form-control" name="phone"></div>
</div>
<div class="row">
<div class="col-md-4 mb-3"><label>Hire Date</label><input type="date" class="form-control" name="hire_date"></div>
<div class="col-md-4 mb-3"><label>Salary</label><input type="number" class="form-control" name="salary" step="0.01" value="0"></div>
<div class="col-md-4 mb-3"><label>Status</label><select class="form-select" name="status">
<option value="Active">Active</option><option value="Inactive">Inactive</option>
</select></div>
</div>
<div class="mb-3"><label>Address</label><textarea class="form-control" name="address" rows="2"></textarea></div>
<button type="submit" class="btn btn-primary">Save Employee</button>
<a href="{{ url_for('employees') }}" class="btn btn-secondary">Cancel</a>
</form>
</div></div>
{% endblock %}
