{% extends "base.html" %}
{% block title %}Add Task{% endblock %}
{% block content %}
<div class="page-header"><h2>Add Task</h2></div>
<div class="card"><div class="card-body">
<form method="POST">
<input type="hidden" name="project_id" value="{{ project_id }}">
<div class="mb-3"><label>Title *</label><input type="text" class="form-control" name="title" required></div>
<div class="mb-3"><label>Description</label><textarea class="form-control" name="description" rows="3"></textarea></div>
<div class="row">
<div class="col-md-4 mb-3"><label>Assigned To</label><input type="text" class="form-control" name="assigned_to"></div>
<div class="col-md-4 mb-3"><label>Status</label><select class="form-select" name="status">
<option value="Pending">Pending</option><option value="In Progress">In Progress</option><option value="Completed">Completed</option>
</select></div>
<div class="col-md-4 mb-3"><label>Priority</label><select class="form-select" name="priority">
<option value="Low">Low</option><option value="Medium" selected>Medium</option><option value="High">High</option>
</select></div>
</div>
<div class="row">
<div class="col-md-6 mb-3"><label>Start Date</label><input type="date" class="form-control" name="start_date"></div>
<div class="col-md-6 mb-3"><label>Due Date</label><input type="date" class="form-control" name="due_date"></div>
</div>
<button type="submit" class="btn btn-primary">Save Task</button>
<a href="{{ url_for('tasks') }}" class="btn btn-secondary">Cancel</a>
</form>
</div></div>
{% endblock %}
